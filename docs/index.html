<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06121f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Icepac Browser</title>
<style>
  :root { --bg:#06121f; --panel:#0d2238; --line:#1b4a6b; --ice:#5ce1ff; --text:#e6f6ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { display:flex; gap:8px; padding:10px; background:var(--panel); box-shadow:0 0 18px rgba(92,225,255,.15); }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:999px; border:1px solid var(--line); background:#081a2c; color:var(--text); font-size:16px; outline:none; }
  input:focus { border-color:var(--ice); box-shadow:0 0 12px rgba(92,225,255,.5); }
  .ic { width:44px; border-radius:50%; border:1px solid var(--ice); background:transparent; color:var(--ice); font-size:20px; }
  .ic:active { background:var(--ice); color:var(--bg); }
  #tabs { display:flex; gap:6px; padding:6px 8px 0; background:var(--panel); overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .tab { display:flex; align-items:center; gap:6px; min-width:110px; max-width:160px; padding:8px 10px; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; background:#081a2c; font-size:13px; opacity:.7; }
  .tab.on { opacity:1; border-color:var(--ice); box-shadow:0 -2px 10px rgba(92,225,255,.25); }
  .tab span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab b { padding:0 4px; opacity:.7; }
  #newtab { min-width:38px; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; background:#081a2c; color:var(--ice); font-size:20px; }
  #bar { height:2px; background:var(--ice); width:0; transition:width .4s; box-shadow:0 0 8px var(--ice); }
  main { flex:1; position:relative; overflow:auto; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  #home { padding:20px 16px 30px; text-align:center; }
  h1 { color:var(--ice); letter-spacing:4px; text-shadow:0 0 14px rgba(92,225,255,.6); margin:4px 0 16px; }
  h2 { font-size:13px; letter-spacing:2px; opacity:.6; margin:24px 0 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid a, .grid button.t { display:flex; align-items:center; justify-content:center; gap:10px; padding:18px 10px; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--text); text-decoration:none; font-size:16px; overflow:hidden; }
  .grid a:active, .grid button.t:active { border-color:var(--ice); box-shadow:0 0 12px rgba(92,225,255,.4); }
  .dot { width:12px; height:12px; flex:none; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
  .dl { display:block; padding:16px; margin-top:12px; border-radius:14px; border:1px solid var(--ice); background:rgba(92,225,255,.1); color:var(--ice); text-decoration:none; font-size:16px; width:100%; }
  small { display:block; margin-top:14px; opacity:.55; line-height:1.4; }
  nav { display:flex; background:var(--panel); border-top:1px solid var(--line); padding:4px 2px calc(4px + env(safe-area-inset-bottom)); }
  nav button { flex:1; background:none; border:0; color:var(--ice); font-size:21px; padding:8px 0; min-width:0; }
  nav button span { display:block; font-size:10px; opacity:.7; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav button:active { background:rgba(92,225,255,.15); border-radius:12px; }
  nav button:disabled { opacity:.3; }
  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:10; }
  .card { width:100%; max-height:80%; overflow:auto; background:var(--panel); border-top:1px solid var(--ice); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:18px; }
  .top button { background:none; border:0; font-size:20px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  .rowmain { flex:1; text-align:left; padding:12px; border-radius:10px; border:1px solid var(--line); background:#081a2c; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .x { width:42px; border-radius:10px; border:1px solid var(--line); background:#081a2c; }
  .card input { width:100%; flex:none; margin-bottom:10px; border-radius:10px; }
  .card .dl { cursor:pointer; margin-top:8px; }
  .card p { line-height:1.5; opacity:.85; margin:8px 0; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--ice); padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20; max-width:90%; text-align:center; }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Search or enter address" autocomplete="off" autocapitalize="off" enterkeyhint="go">
  <button class="ic" id="star" title="Bookmark">&#9734;</button>
  <button class="ic" id="out" title="Open in browser tab">&#8599;</button>
</header>
<div id="tabs"></div>
<div id="bar"></div>
<main id="main">
  <div id="home">
    <h1>ICEPAC</h1>
    <div class="grid">
      <a href="#" data-u="https://www.google.com"><i class="dot" style="--c:#4285f4"></i>Google</a>
      <a href="#" data-u="https://m.youtube.com"><i class="dot" style="--c:#ff0033"></i>YouTube</a>
      <a href="#" data-u="https://www.tiktok.com"><i class="dot" style="--c:#25f4ee"></i>TikTok</a>
      <a href="#" data-u="https://www.instagram.com"><i class="dot" style="--c:#e1306c"></i>Instagram</a>
      <a href="#" data-u="https://en.wikipedia.org"><i class="dot" style="--c:#aaa"></i>Wikipedia</a>
      <a href="#" data-u="https://example.com"><i class="dot" style="--c:#5ce1ff"></i>Example</a>
    </div>
    <div id="markswrap"><h2>BOOKMARKS</h2><div class="grid" id="marks"></div></div>
    <h2>GET ICEPAC</h2>
    <a class="dl" id="dlwin" target="_blank" rel="noopener">&#11015; Download for Windows</a>
    <button class="dl" id="dlphone">&#128241; Install on phone</button>
    <small>Google, YouTube, TikTok and Instagram block embedding, so they open in a new browser tab (or their app). Windows may show a SmartScreen warning: click More info, then Run anyway.</small>
  </div>
</main>
<nav>
  <button id="back" disabled>&#9664;<span>Back</span></button>
  <button id="fwd" disabled>&#9654;<span>Forward</span></button>
  <button id="homeBtn">&#8962;<span>Home</span></button>
  <button id="reload">&#10227;<span>Reload</span></button>
  <button id="marksBtn">&#9733;<span>Bookmarks</span></button>
  <button id="acct">&#128100;<span id="acctLabel">Guest</span></button>
</nav>
<div id="sheet"><div class="card"><div class="top"><b id="stitle"></b><button id="sclose">&#10005;</button></div><div id="sbody"></div></div></div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const REL = 'https://github.com/ferdinandbarrack58-ship-it/icepac-browser/releases/latest';
const BLOCKED = ['google.', 'youtube.', 'youtu.be', 'tiktok.', 'instagram.', 'facebook.', 'x.com', 'twitter.'];
const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let user = null, data = { bookmarks: [] }, tabs = [], active = null, nid = 1, installEvt = null;
const key = () => 'icepac_data_' + (user || 'guest');
const save = () => ls.set(key(), data);
const url = $('url'), home = $('home'), bar = $('bar'), main = $('main');

function el(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; }
function say(t) { const er = $('err'); if (er) er.textContent = t; const x = $('toast'); x.textContent = t; x.style.opacity = 1; setTimeout(() => x.style.opacity = 0, 2400); }
function normalize(v) {
  v = v.trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return 'https://' + v;
  return 'https://www.google.com/search?q=' + encodeURIComponent(v);
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const isBlocked = u => { try { const h = new URL(u).hostname; return BLOCKED.some(b => h.includes(b)); } catch { return false; } };

/* ---------- sheets ---------- */
function openSheet(title, build) { $('stitle').textContent = title; const b = $('sbody'); b.replaceChildren(); build(b); $('sheet').style.display = 'flex'; }
function closeSheet() { $('sheet').style.display = 'none'; }
$('sclose').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

/* ---------- tabs ---------- */
function newTab(u) {
  const t = { id: nid++, url: '', hist: [''], idx: 0, frame: null, title: 'New tab' };
  tabs.push(t); select(t.id); if (u) go(u);
}
function showBlocked() {
  let b = $('blockedPane');
  if (!b) { b = el('div', { id: 'blockedPane', style: 'padding:40px 20px;text-align:center' }); main.append(b); }
  b.replaceChildren();
  if (active.blocked) {
    b.append(el('h2', { textContent: host(active.url) }),
      el('p', { textContent: 'This site does not allow being shown inside another page, so it opens in your browser instead. Tap below to open it again.' }),
      el('button', { className: 'dl', textContent: 'Open ' + host(active.url), onclick: () => window.open(active.url, '_blank', 'noopener') }));
    b.style.display = 'block';
  } else b.style.display = 'none';
}
function select(id) {
  active = tabs.find(t => t.id === id);
  tabs.forEach(t => { if (t.frame) t.frame.style.display = (t === active && t.url && !t.blocked) ? 'block' : 'none'; });
  home.style.display = active.url ? 'none' : 'block'; showBlocked();
  url.value = active.url; renderTabs(); buttons(); updateStar();
}
function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  if (tabs[i].frame) tabs[i].frame.remove();
  tabs.splice(i, 1);
  if (!tabs.length) newTab(); else select((tabs[i] || tabs[i - 1]).id);
}
function renderTabs() {
  const box = $('tabs'); box.replaceChildren();
  tabs.forEach(t => box.append(el('div', { className: 'tab' + (t === active ? ' on' : ''), onclick: () => select(t.id) },
    el('span', { textContent: t.title }),
    el('b', { textContent: '\u2715', onclick: e => { e.stopPropagation(); closeTab(t.id); } }))));
  box.append(el('button', { id: 'newtab', textContent: '+', onclick: () => newTab() }));
}
function show(t, u) { t.blocked = false;
  t.url = u; t.title = u ? host(u) : 'New tab';
  if (u) {
    if (!t.frame) { t.frame = el('iframe', { referrerPolicy: 'no-referrer' }); main.append(t.frame); t.frame.addEventListener('load', () => { if (t === active) { bar.style.width = '100%'; setTimeout(() => bar.style.width = '0', 400); } }); }
    if (t === active) bar.style.width = '30%';
    t.frame.src = u;
  } else if (t.frame) { t.frame.src = 'about:blank'; }
  select(t.id);
}
function go(v) {
  const u = normalize(v); if (!u) return;
  if (isBlocked(u)) { active.hist = active.hist.slice(0, active.idx + 1); active.hist.push(u); active.idx = active.hist.length - 1; active.url = u; active.title = host(u); active.blocked = true; select(active.id); window.open(u, '_blank', 'noopener'); return; }
  active.hist = active.hist.slice(0, active.idx + 1); active.hist.push(u); active.idx = active.hist.length - 1; show(active, u);
}
function buttons() { $('back').disabled = active.idx === 0; $('fwd').disabled = active.idx >= active.hist.length - 1; }

url.addEventListener('keydown', e => { if (e.key === 'Enter') { go(url.value); url.blur(); } });
$('back').onclick = () => { if (active.idx > 0) { active.idx--; show(active, active.hist[active.idx]); } };
$('fwd').onclick = () => { if (active.idx < active.hist.length - 1) { active.idx++; show(active, active.hist[active.idx]); } };
$('homeBtn').onclick = () => { if (active.url) { active.hist = active.hist.slice(0, active.idx + 1); active.hist.push(''); active.idx++; show(active, ''); } };
$('reload').onclick = () => { if (active.url && active.frame) { bar.style.width = '30%'; active.frame.src = active.url; } };
$('out').onclick = () => { const u = active.url || normalize(url.value); if (u) window.open(u, '_blank', 'noopener'); else say('Nothing to open yet'); };

/* ---------- bookmarks ---------- */
const cur = () => active.url || normalize(url.value);
function updateStar() { const u = cur(); $('star').textContent = (u && data.bookmarks.some(m => m.u === u)) ? '\u2605' : '\u2606'; }
$('star').onclick = () => {
  const u = cur(); if (!u) { say('Open a page first'); return; }
  const i = data.bookmarks.findIndex(m => m.u === u);
  if (i >= 0) { data.bookmarks.splice(i, 1); say('Bookmark removed'); }
  else { data.bookmarks.push({ t: host(u), u }); say('Bookmarked'); }
  save(); updateStar(); renderMarks();
};
function renderMarks() {
  const box = $('marks'); box.replaceChildren();
  data.bookmarks.forEach(m => box.append(el('button', { className: 't', title: m.u, textContent: m.t, onclick: () => go(m.u) })));
  $('markswrap').style.display = data.bookmarks.length ? 'block' : 'none';
}
function marksSheet() {
  openSheet('Bookmarks', b => {
    if (!data.bookmarks.length) b.append(el('p', { textContent: 'No bookmarks yet. Tap the star next to the address bar to add one.' }));
    data.bookmarks.forEach((m, i) => b.append(el('div', { className: 'row' },
      el('button', { className: 'rowmain', title: m.u, textContent: m.t, onclick: () => { closeSheet(); go(m.u); } }),
      el('button', { className: 'x', textContent: '\u2715', onclick: () => { data.bookmarks.splice(i, 1); save(); marksSheet(); renderMarks(); updateStar(); } }))));
  });
}
$('marksBtn').onclick = marksSheet;

/* ---------- accounts (stored on this device only) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hash(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 100000, hash: 'SHA-256' }, k, 256));
}
function afterAuth(msg) {
  ls.set('icepac_session', user);
  data = ls.get(key(), { bookmarks: [] });
  $('acctLabel').textContent = user || 'Guest';
  renderMarks(); updateStar(); closeSheet(); if (msg) say(msg);
}
async function signup() {
  const n = $('u').value.trim().toLowerCase().replace(/^@+/, ''), p = $('p').value;
  if (!/^[a-z0-9_]{3,20}$/.test(n)) return say('Username: 3-20 letters, numbers or _');
  if (p.length < 6) return say('Password needs 6+ characters');
  const users = ls.get('icepac_users', {});
  if (users[n]) return say('That username is taken on this device');
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  users[n] = { salt, hash: await hash(p, salt) }; ls.set('icepac_users', users);
  const keep = data; user = n; ls.set(key(), keep); afterAuth('Account created');
}
async function signin() {
  const n = $('u').value.trim().toLowerCase().replace(/^@+/, ''), p = $('p').value;
  const users = ls.get('icepac_users', {}), rec = users[n];
  if (!rec || (await hash(p, rec.salt)) !== rec.hash) return say('Wrong username or password');
  user = n; afterAuth('Signed in as ' + n);
}
function acctSheet() {
  openSheet('Account', b => {
    if (user) {
      b.append(el('p', { textContent: 'Signed in as ' + user + '. Your bookmarks are saved to this account on this device.' }),
        el('button', { className: 'dl', textContent: 'Sign out', onclick: () => { user = null; afterAuth('Signed out'); } }));
    } else {
      b.append(el('input', { id: 'u', placeholder: 'Username (letters, numbers, _)', autocapitalize: 'off', autocomplete: 'username' }),
        el('input', { id: 'p', type: 'password', placeholder: 'Password (6+ characters)', autocomplete: 'current-password' }),
        el('button', { className: 'dl', textContent: 'Sign in', onclick: signin }),
        el('button', { className: 'dl', textContent: 'Create account', onclick: signup }),
        el('p', { id: 'err', style: 'color:#ff8a8a;margin:4px 0;min-height:1.2em' }), el('p', { textContent: 'Accounts are stored on this device only and do not sync to other devices. Your guest bookmarks carry over when you create an account.' }));
    }
  });
}
$('acct').onclick = acctSheet;

/* ---------- downloads ---------- */
$('dlwin').href = REL;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
$('dlphone').onclick = async () => {
  if (installEvt) { installEvt.prompt(); installEvt = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet('Install on phone', b => b.append(el('p', { textContent: ios
    ? 'On iPhone: open this page in Safari, tap the Share button, then choose Add to Home Screen.'
    : 'On Android: open the browser menu (three dots), then tap Install app or Add to Home screen.' }),
    el('p', { textContent: 'Icepac then opens full-screen from your home screen, like an app.' })));
};

/* ---------- start ---------- */
document.querySelectorAll('[data-u]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.u); });
const sess = ls.get('icepac_session', null);
if (sess && ls.get('icepac_users', {})[sess]) user = sess;
data = ls.get(key(), { bookmarks: [] });
$('acctLabel').textContent = user || 'Guest';
renderMarks(); newTab();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
